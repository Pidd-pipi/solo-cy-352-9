name: lpboardgame

services:
  db:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-lpboardgame}-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-27017}:27017"
    volumes:
      - db_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-lpboardgame}-backend
    restart: unless-stopped
    environment:
      PORT: 29512
      DB_HOST: db
      DB_PORT: 27017
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DATABASE_URL: mongodb://${DB_USER}:${DB_PASSWORD}@db:27017/${DB_NAME}?authSource=admin
      SPRING_DATASOURCE_URL: 
      SPRING_DATASOURCE_DRIVER: 
      SPRING_JPA_DATABASE_PLATFORM: 
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BACKEND_PORT:-29512}:29512"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:29512/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-lpboardgame}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28512}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
